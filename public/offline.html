<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Zenith</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center;
             background: #080B14; color: #e6ecf8;
             font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 30rem; padding: 32px 24px; text-align: center; }
      svg { opacity: .8; }
      h1 { font-size: 20px; margin: 20px 0 8px; letter-spacing: -.02em; }
      p { margin: 0 0 20px; color: #9fb0cc; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px;
               background: #2f6fd0; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:hover { background: #3b7ee0; }
    </style>
  </head>
  <body>
    <main>
      <svg width="44" height="44" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="10.5" stroke="#9cc4f0" stroke-width="2" opacity="0.6" />
        <path d="M16 10.5l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#e6ecf8" />
      </svg>
      <h1>You're offline</h1>
      <p>Zenith needs a connection to scan sites and load your reports. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </main>
  </body>
</html>
